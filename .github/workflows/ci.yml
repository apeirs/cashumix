name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Offline: the mixnet, DoH resolver and mint are fakes (internal/fakes). The live test
      # needs a running nym-socks5-client and only runs with CASHUMIX_LIVE=1.
      - run: go test -race -count=1 ./...
      - run: go build -o /dev/null ./cmd/cashumix
